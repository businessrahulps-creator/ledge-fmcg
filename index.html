  <body>
    <!-- Opening animation. Inline on purpose: it must paint on the very first
         frame, before any app code has downloaded, so the app never looks dead. -->
    <style>
      html, body { background-color: #0F1F3A; }
      #ledge-splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0F1F3A;
        color: #F5EFE6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity .44s cubic-bezier(.4,0,.2,1), transform .44s cubic-bezier(.4,0,.2,1);
        padding: 24px; text-align: center;
      }
      /* optical centring: the lockup sits slightly above the true middle */
      #ledge-splash > * { position: relative; transform: translateY(-14px); }
      #ledge-splash::before {
        content: ""; position: absolute; left: 50%; top: 46%; width: 460px; height: 460px;
        margin: -230px 0 0 -230px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(197,214,245,.085) 0%, rgba(197,214,245,0) 66%);
      }
      #ledge-splash.ledge-splash-out { opacity: 0; transform: translateY(-6px); pointer-events: none; }
      .ledge-mark { width: 58px; height: 58px; animation: ledge-mark-in .5s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes ledge-mark-in { from { opacity: 0 } to { opacity: 1 } }
      .ledge-mark rect.s {
        transform-box: fill-box; transform-origin: left center;
        animation: ledge-stripe .62s cubic-bezier(.2,.75,.2,1) both;
      }
      .ledge-mark rect.s:nth-of-type(1) { animation-delay: .06s }
      .ledge-mark rect.s:nth-of-type(2) { animation-delay: .13s }
      .ledge-mark rect.s:nth-of-type(3) { animation-delay: .20s }
      .ledge-mark rect.s:nth-of-type(4) { animation-delay: .27s }
      @keyframes ledge-stripe { from { transform: scaleX(0); opacity: .2 } to { transform: scaleX(1); opacity: 1 } }
      .ledge-word {
        margin-top: 21px; font-size: 31px; letter-spacing: -.005em; line-height: 1;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 600; color: #F5EFE6;
        animation: ledge-fade-up .55s cubic-bezier(.2,.7,.2,1) .30s both;
      }
      @keyframes ledge-fade-up { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .ledge-bar {
        margin-top: 27px; width: 116px; height: 2px; border-radius: 2px;
        background: rgba(245,239,230,.12); overflow: hidden;
        animation: ledge-fade-in .5s ease-out .5s both;
      }
      @keyframes ledge-fade-in { from { opacity: 0 } to { opacity: 1 } }
      .ledge-bar i {
        position: absolute; inset: 0 auto 0 0; display: block; width: 6%; border-radius: 2px;
        background: linear-gradient(90deg, rgba(196,112,63,.65), #C4703F);
        transition: width .55s cubic-bezier(.4,0,.2,1);
      }
      .ledge-bar.indeterminate i { width: 38%; animation: ledge-slide 1.5s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes ledge-slide { 0% { transform: translateX(-115%) } 100% { transform: translateX(285%) } }
      .ledge-step {
        margin-top: 15px; font-size: 12.5px; letter-spacing: .01em;
        color: rgba(245,239,230,.55); min-height: 17px;
        animation: ledge-fade-in .5s ease-out .6s both;
        transition: opacity .18s linear;
      }
      .ledge-step.swap { opacity: 0 }
      .ledge-slow { margin-top: 12px; font-size: 12.5px; color: rgba(245,239,230,.55); display: none; }
      .ledge-slow button {
        background: none; border: 0; color: #E2B79A; font: inherit; text-decoration: underline;
        cursor: pointer; padding: 6px 8px; min-height: 32px;
      }
      #ledge-splash.slow .ledge-slow { display: block; }
      @media (prefers-reduced-motion: reduce) {
        #ledge-splash *, #ledge-splash { animation: none !important; transition: opacity .2s linear !important; }
      }
    </style>
    <div id="ledge-splash" role="status" aria-live="polite" aria-label="Loading Ledge">
      <svg class="ledge-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="0" y="0" width="48" height="48" rx="11" fill="#F5EFE6" opacity=".07"></rect>
        <rect class="s" x="9" y="10" width="30" height="5" rx="2.5" fill="#F5EFE6"></rect>
        <rect class="s" x="9" y="19" width="22" height="5" rx="2.5" fill="#F5EFE6" opacity=".85"></rect>
        <rect class="s" x="9" y="28" width="26" height="5" rx="2.5" fill="#C4703F"></rect>
        <rect class="s" x="9" y="37" width="16" height="5" rx="2.5" fill="#F5EFE6" opacity=".6"></rect>
      </svg>
      <div class="ledge-word">Ledge</div>
      <div class="ledge-bar indeterminate" id="ledge-bar"><i></i></div>
      <div class="ledge-step" id="ledge-step">Starting Ledge</div>
      <div class="ledge-slow">Slow connection — still loading.
        <button type="button" onclick="location.reload()">Retry</button>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("ledge-splash");
        if (!el) return;
        var stepEl = document.getElementById("ledge-step");
        var bar = document.getElementById("ledge-bar");
        var fill = bar && bar.firstElementChild;
        var finished = false;
        var started = Date.now();
        var slowTimer = setTimeout(function () { el.classList.add("slow"); }, 10000);
        var maxTimer = setTimeout(function () { api.done(); }, 30000);
        var api = {
          step: function (label, pct) {
            if (finished) return;
            if (label && stepEl && stepEl.textContent !== label) {
              stepEl.classList.add("swap");
              setTimeout(function () {
                stepEl.textContent = label;
                stepEl.classList.remove("swap");
              }, 180);
            }
            if (typeof pct === "number" && fill) {
              bar.classList.remove("indeterminate");
              fill.style.transform = "none";
              fill.style.width = Math.max(6, Math.min(96, pct)) + "%";
            }
          },
          done: function () {
            if (finished) return;
            var left = 1100 - (Date.now() - started);
            if (left > 0) { setTimeout(api.done, left); return; }
            finished = true;
            clearTimeout(slowTimer); clearTimeout(maxTimer);
            if (fill) { bar.classList.remove("indeterminate"); fill.style.transform = "none"; fill.style.width = "100%"; }
            setTimeout(function () {
              el.classList.add("ledge-splash-out");
              setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 460);
            }, 150);
          }
        };
        window.__ledgeSplash = api;
      })();
    </script>
