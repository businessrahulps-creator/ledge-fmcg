  <body>
    <!-- Opening animation. Inline on purpose: it must paint on the very first
         frame, before any app code has downloaded, so the app never looks dead. -->
    <style>
      html, body { background-color: #080C16; }
      #ledge-splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        background: #080C16;
        color: #F5EFE6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1);
      }
      #ledge-splash::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 80% at 50% 40%, rgba(255,255,255,.035) 0%, rgba(0,0,0,0) 55%),
                    radial-gradient(100% 70% at 50% 100%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
      }
      #ledge-splash.ledge-splash-out { opacity: 0; transform: translateY(-10px); pointer-events: none; }
      .ledge-ribbon { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ledge-ribbon path {
        fill: none; stroke-linecap: round; stroke-linejoin: round;
        transition: stroke-dashoffset 1.25s cubic-bezier(.32,.72,.26,1);
      }
      .ledge-ribbon.drawn path { stroke-dashoffset: 0 !important; }
      .ledge-word {
        position: absolute; left: 0; right: 0; top: 62%; text-align: center;
        font-size: 46px; letter-spacing: .04em; line-height: 1;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 500; color: #F5EFE6;
        animation: ledge-fade-up .7s cubic-bezier(.22,1,.36,1) .85s both;
      }
      @keyframes ledge-fade-up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .ledge-foot {
        position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
        color: rgba(245,239,230,.38);
        animation: ledge-fade-up .6s ease-out 1.15s both;
      }
      .ledge-foot svg { width: 14px; height: 14px; display: block; }
      .ledge-slow {
        position: absolute; left: 0; right: 0; bottom: 78px; text-align: center;
        font-size: 12.5px; color: rgba(245,239,230,.55); display: none;
      }
      .ledge-slow button {
        background: none; border: 0; color: #E2B79A; font: inherit; text-decoration: underline;
        cursor: pointer; padding: 6px 8px; min-height: 32px;
      }
      #ledge-splash.slow .ledge-slow { display: block; }
      @media (prefers-reduced-motion: reduce) {
        #ledge-splash *, #ledge-splash { animation: none !important; transition: opacity .2s linear !important; }
        .ledge-ribbon path { stroke-dashoffset: 0 !important; }
      }
    </style>
    <div id="ledge-splash" role="status" aria-live="polite" aria-label="Loading Ledge">
      <svg class="ledge-ribbon" id="ledge-ribbon" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="ledge-grad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#4C3A8C"></stop>
            <stop offset="0.35" stop-color="#2E5AA8"></stop>
            <stop offset="0.62" stop-color="#3E7FA8"></stop>
            <stop offset="0.84" stop-color="#C4703F"></stop>
            <stop offset="1" stop-color="#F0C48A"></stop>
          </linearGradient>
        </defs>
        <path id="ledge-path" stroke="url(#ledge-grad)" stroke-width="26"
          d="M -60 600 C 40 600 44 452 140 452 C 222 452 226 578 146 582 C 62 586 40 448 142 360 C 236 279 254 130 178 130 C 112 130 104 314 202 384 C 296 452 368 418 460 342"></path>
      </svg>
      <div class="ledge-word">Ledge</div>
      <div class="ledge-slow">Still loading — slow connection.
        <button type="button" onclick="location.reload()">Retry</button>
      </div>
      <div class="ledge-foot">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="9" width="36" height="5" rx="2.5" fill="#F5EFE6"></rect>
          <rect x="6" y="19" width="26" height="5" rx="2.5" fill="#F5EFE6" opacity=".8"></rect>
          <rect x="6" y="29" width="31" height="5" rx="2.5" fill="#C4703F"></rect>
          <rect x="6" y="39" width="19" height="5" rx="2.5" fill="#F5EFE6" opacity=".55"></rect>
        </svg>
        <span>Ledge · FMCG operations</span>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("ledge-splash");
        if (!el) return;
        var svg = document.getElementById("ledge-ribbon");
        var path = document.getElementById("ledge-path");
        try {
          var L = path.getTotalLength();
          path.style.strokeDasharray = L + " " + L;
          path.style.strokeDashoffset = L;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { svg.classList.add("drawn"); });
          });
        } catch (e) { /* no geometry: leave the ribbon fully drawn */ }
        var finished = false;
        var started = Date.now();
        var slowTimer = setTimeout(function () { el.classList.add("slow"); }, 10000);
        var maxTimer = setTimeout(function () { api.done(); }, 30000);
        var api = {
          step: function () { /* the animation speaks for itself */ },
          done: function () {
            if (finished) return;
            var left = 1500 - (Date.now() - started);
            if (left > 0) { setTimeout(api.done, left); return; }
            finished = true;
            clearTimeout(slowTimer); clearTimeout(maxTimer);
            el.classList.add("ledge-splash-out");
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 540);
          }
        };

        window.__ledgeSplash = api;
      })();
    </script>
